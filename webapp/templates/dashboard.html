{% extends "base.html" %}
{% block content %}

<!-- Plain GET form -> "/". A normal browser submit (no JS needed), so the
     filters and sort always work. Changing any control auto-submits; the
     Apply button is the fallback. -->
<form method="get" action="/" id="screen"
      class="flex flex-wrap items-end gap-4 mb-5">

  <label class="text-sm">
    <span class="block text-gray-400 mb-1">Ticker</span>
    <select name="ticker" onchange="this.form.submit()"
            class="bg-gray-900 border border-gray-700 rounded px-2 py-1 text-gray-100">
      <option value="">All</option>
      {% for t in tickers %}
      <option value="{{ t }}" {% if t == ticker %}selected{% endif %}>{{ t }}</option>
      {% endfor %}
    </select>
  </label>

  <label class="text-sm">
    <span class="block text-gray-400 mb-1">Label</span>
    <select name="label" onchange="this.form.submit()"
            class="bg-gray-900 border border-gray-700 rounded px-2 py-1 text-gray-100">
      <option value="">All</option>
      {% for l in labels %}
      <option value="{{ l }}" {% if l == label %}selected{% endif %}>{{ l }}</option>
      {% endfor %}
    </select>
  </label>

  <label class="text-sm">
    <span class="block text-gray-400 mb-1">Sort by</span>
    <select name="sort" onchange="this.form.submit()"
            class="bg-gray-900 border border-gray-700 rounded px-2 py-1 text-gray-100">
      <option value="score"  {% if sort == 'score'  %}selected{% endif %}>Combined score (high&rarr;low)</option>
      <option value="size"   {% if sort == 'size'   %}selected{% endif %}>Trade size R (high&rarr;low)</option>
      <option value="newest" {% if sort == 'newest' %}selected{% endif %}>Newest first</option>
      <option value="oldest" {% if sort == 'oldest' %}selected{% endif %}>Oldest first</option>
    </select>
  </label>

  <label class="text-sm">
    <span class="block text-gray-400 mb-1">Min combined score</span>
    <input type="number" name="min_score" step="0.05" min="0" max="1"
           value="{{ min_score if min_score is not none else '' }}"
           onchange="this.form.submit()"
           class="w-24 bg-gray-900 border border-gray-700 rounded px-2 py-1 text-gray-100">
  </label>

  <button type="submit"
          class="rounded bg-emerald-600 hover:bg-emerald-500 px-4 py-1.5 text-sm font-semibold text-white">
    Apply
  </button>
  <a href="/" class="text-sm text-gray-400 hover:text-gray-200 self-center">Reset</a>

  <span class="text-xs text-gray-500 ml-auto self-center">
    Showing <strong class="text-gray-300">{{ shown }}</strong> of {{ total }} stored signals
    {% if shown == 150 %}<span class="text-gray-600">(capped at 150 &mdash; narrow the filter to see more)</span>{% endif %}
  </span>
</form>

<div id="signals">
  {% include "_signals.html" %}
</div>

{% endblock %}
