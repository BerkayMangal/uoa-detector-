# UOA + Convexity Detector v5 — default calibration profile.
# Every value here comes directly from UOA_Convexity_Detector_v5.docx.
# Do not edit casually — use a child profile with inherits_from: v5_default
# and override only the leaves you mean to change (deep-merge inheritance).

profile_id: v5_default
description: "Default v5 spec values, exhaustive. Source of truth for all defaults."
inherits_from: null

# --- Combined-score formula (Part 3) ---
scoring:
  uoa: 0.30
  convexity: 0.25
  event: 0.15
  gamma: 0.10
  price_confirmation: 0.10
  sector_confirmation: 0.05
  time_of_day: 0.05
  # Phase 3.4 per-module tunables. Each block ships with default_factory
  # in code, so a profile YAML omitting `modules:` still loads — the
  # explicit blocks here pin the default values for grep-ability and
  # operator inspection.
  modules:
    # M21 — Dealer gamma exposure score (Phase 3.4.1)
    m21:
      short_gamma_threshold: -50_000_000   # USD/1% spot move; below = dealers short
      flip_proximity_pct: 0.03             # |spot-flip|/spot < 3% = ripe
      extreme_distance_pct: 0.20           # > 20% from flip = collapse to 0
      provider_timeout_s: 2.0
      provider_cache_ttl_s: 300            # provider owns cache; this is reserve
    # M22 — Event calendar score (Phase 3.4.2)
    m22:
      post_event_blackout_days: 1          # 1 day after catalyst = blackout
      pre_event_window_days: 14            # look-ahead horizon for upcoming
      no_catalyst_neutral_score: 0.3       # absence ≠ zero edge
      dte_survives_score: 1.0              # option lives past catalyst
      dte_expires_before_score: 0.5        # option dies before catalyst
      post_event_score: 0.0
      provider_timeout_s: 2.0
      provider_cache_ttl_s: 3600           # calendars change infrequently
    # M23 — Price confirmation score (Phase 3.4.3)
    m23:
      lookback_minutes: 30                 # spot-move window
      confirmation_pct: 0.005              # 0.5% spot move threshold
      confirmed_score: 1.0
      contrarian_score: 0.3                # opposite-direction move > threshold
      neutral_score: 0.5                   # default when no signal either way
      session_open_utc_hour: 14            # 09:30 ET during DST = 14:30 UTC
      session_open_utc_minute: 30
      provider_timeout_s: 2.0
      provider_cache_ttl_s: 60             # intraday — changes by the second
    # M24 — IV exhaustion score (Phase 3.4.4)
    m24:
      low_iv_threshold: 30.0               # IV rank < 30 = cheap
      mid_iv_threshold: 60.0               # 30-60 = moderate
      high_iv_threshold: 80.0              # >= 80 = expensive (zero score)
      cheap_iv_score: 1.0
      moderate_iv_score: 0.7
      elevated_iv_score: 0.3
      expensive_iv_score: 0.0
      no_iv_history_score: 0.5             # new listing fallback
      post_earnings_iv_penalty: -0.4       # cross-module ScoreAdjustment
      post_earnings_iv_penalty_threshold: 80.0
      post_earnings_session_days: 1        # "within 1 session"
      provider_timeout_s: 2.0
      provider_cache_ttl_s: 600            # IV rank changes slowly
    # M25 — Sector peer score (Phase 3.4.5)
    m25:
      peer_window_minutes: 30              # lookback for peer flow events
      peer_count: 5                        # top N peers to query
      strong_alignment_threshold: 0.6      # >60% same-direction = full
      moderate_alignment_threshold: 0.4    # 40-60%
      weak_alignment_threshold: 0.2        # 20-40%; below = contrarian
      strong_alignment_score: 1.0
      moderate_alignment_score: 0.7
      weak_alignment_score: 0.3
      contrarian_score: 0.0
      no_sector_score: 0.5                 # ETFs / illiquid / missing data
      empty_peer_flow_score: 0.5           # small sector / quiet period
      timeout_score: 0.5
      provider_timeout_s: 3.0              # higher: multi-ticker fetch
      provider_cache_ttl_s: 60
    # M26 — Dark pool corroboration (Phase 3.4.6)
    m26:
      dark_pool_lookback_minutes: 60       # look back 1 hour
      min_print_size_usd: 5_000_000        # $5M institutional threshold
      confirmed_match_score: 1.0           # DP direction matches option
      direction_unclear_score: 0.5         # midpoint/unknown side
      no_qualifying_prints_score: 0.2      # low fallback (NOT zero)
      timeout_score: 0.5
      delay_warning_minutes: 5             # log if latest print > 5m old
      provider_timeout_s: 2.0
      provider_cache_ttl_s: 30             # short TTL — DP intraday-fast

# --- Early-convexity score (Part 3) ---
early_scoring:
  convexity: 0.40
  cluster_density: 0.20
  event: 0.15
  gamma: 0.15
  time_of_day: 0.10

# --- Module 36 penalties (negative deductions) ---
penalties:
  post_gap_move: -0.20            # Flow after >3% gap open
  iv_rank_high: -0.15             # IV_rank > 80
  wide_spread: -0.15              # spread > 15% of mid
  thin_oi: -0.20                  # OI < 100 at strike
  flow_contradicts_price: -0.15   # call vs downtrend / put vs uptrend
  post_event: -0.25               # within 2 sessions of catalyst
  isolated_print: -0.10           # no repeat within 30 min
  next_day_oi_failed: -0.20       # OI drops > 30% of trade size

# --- Penalty trigger thresholds (decide whether each penalty fires) ---
penalty_triggers:
  gap_threshold_pct: 3.0
  iv_rank_threshold: 80
  spread_pct_threshold: 15.0
  thin_oi_threshold: 100
  isolated_window_min: 30
  next_day_oi_drop_pct: 30.0
  post_event_sessions: 2

# --- Contradiction (counted once via penalties.flow_contradicts_price) ---
contradiction:
  magnitude: -0.15
  enabled: true

# --- Module 35 DTE multipliers ---
dte:
  bucket_0_7: 1.20
  bucket_8_14: 1.10
  bucket_15_30: 1.00
  bucket_31_60: 0.85
  bucket_60_plus: 0.70
  leap_threshold: 90

# --- Module 39 time-of-day weights ---
# Windows are half-open [start, end) on the wall clock of the configured timezone.
# `outside_session_weight` and `extended_hours_policy` are SPEC-SILENT values:
# the v5 spec defines five windows covering 09:30–16:00 NY equity hours and
# says nothing about pre-market / after-hours. Phase 1 used 0.30; we preserve
# that here for bit-for-bit reproduction but make the gap visible via
# extended_hours_policy="flag" (default) so every extended-hours signal is
# tagged in the decision record. Override per-ticker / per-regime if your use
# case wants different behavior (e.g., "reject" for futures-options strategies
# that should not trade outside RTH).
time_of_day:
  timezone: "America/New_York"
  windows:
    - { start: "09:30", end: "10:00", weight: 0.30, label: "open_auction" }
    - { start: "10:00", end: "11:00", weight: 0.80, label: "early_session" }
    - { start: "11:00", end: "14:00", weight: 1.00, label: "prime_session" }
    - { start: "14:00", end: "15:30", weight: 0.70, label: "afternoon" }
    - { start: "15:30", end: "16:00", weight: 0.30, label: "moc_loc" }
  outside_session_weight: 0.30   # Phase 1 default — spec is silent on extended hours; review per use case.
  extended_hours_policy: "flag"  # weight | flag | reject — see profile.py field docs

# --- Module 38 temporal clustering ---
cluster:
  window_minutes: 60
  decay_minutes: 90
  nearby_strike_count: 1        # ±1 strike on the chain grid
  escalation_ratio: 1.20        # each successive print ≥ 1.20× previous
  density_isolated: 0.0
  density_two_same: 0.4
  density_three_same: 0.8
  density_three_escalating: 1.0
  density_nearby_strikes: 0.6

# --- Module 34 sweep / block ---
sweep:
  iso_bonus: 0.15
  cross_venue_bonus: 0.10
  cross_venue_above_ask_bonus: 0.15
  cross_venue_window_ms: 50

# --- Module 37 relative premium ---
relative_premium:
  high_ratio: 3.0
  mid_ratio: 1.5
  score_high: 1.0
  score_mid: 0.5
  score_low: 0.0
  median_window_days: 30

# --- Labeler thresholds (every numeric comparison the labeler makes) ---
label_thresholds:
  penalized_below: 0.30
  cluster_min: 0.4
  cluster_burst: 0.8
  relative_premium_uoa: 0.5
  convexity_watch_floor: 0.6
  pre_catalyst_event_min: 0.75

# --- Part 5 risk buckets (max-R per label) ---
risk_buckets:
  convexity_watch: 0.25
  convexity_cluster: 0.50         # also covers CONVEXITY_BURST
  standard_uoa: 0.75
  sweep_uoa: 0.85
  pre_catalyst_flow: 0.85
  high_conviction_sequence: 1.00
  high_conviction_initial: 0.50   # scale-in: initial entry
  leap_positioning: 0.25
  discard_or_log: 0.0
  rejected: 0.0                   # Phase 2.3.2a: separate from discard for backtest analysis

# --- Phase 2 fusion layer ---
fusion:
  window_ms: 500                  # OPRA → aggregator latency budget
  timestamp_skew_tolerance_ms: 100
  # Phase 2.3.3 watermark tunables. SPEC-SILENT — surfaced explicitly so the
  # 'one slow source blocks the pipeline' failure mode is operator-tunable
  # rather than a buried constant.
  stalled_source_timeout_ms: 2000     # walltime; force-advance silent source's wm
  allowed_lateness_ms: 200            # how much late-arrival slack to leave
  # Phase 2.3.2 confidence-tier resolution. SPEC-SILENT values — see
  # TierThresholds field docs in calibration/profile.py for the resolution
  # algorithm and the rationale for each default.
  tier_thresholds:
    unanimous_min_sources: 2          # need ≥2 sources for "unanimous"
    majority_fraction: 0.5            # >50% agreement → "majority"
    premium_disagreement_tolerance_pct: 0.05   # within 5% of median = agree

# --- Phase 2 missing-sub-score policy ---
# Per the user's correction: 0.5 is NOT neutral for several sub-scores
# (relative_premium_score = 0.5 means "above average", a positive signal).
# Missing data defaults to 0.0 (truly no signal); time_of_day_weight raises
# because it's always derivable from the timestamp.
sub_score_missing_behavior:
  uoa_score:                  { on_missing: "default", default: 0.0 }
  convexity_score:            { on_missing: "default", default: 0.0 }
  event_score:                { on_missing: "default", default: 0.0 }
  gamma_score:                { on_missing: "default", default: 0.0 }
  price_confirmation_score:   { on_missing: "default", default: 0.0 }
  sector_confirmation_score:  { on_missing: "default", default: 0.0 }
  time_of_day_weight:         { on_missing: "raise" }
  cluster_density_score:      { on_missing: "default", default: 0.0 }
  relative_premium_score:     { on_missing: "default", default: 0.0 }

# --- Phase 3.2.3 backtest configuration ---
# These knobs only affect the metric calculator and PnL provider, not
# live signal generation. Defaults are the Track B + Formülasyon A
# values approved in Phase 3 prep step 3 + acceptance-doc 3.2.0b/3.2.3
# revisions; profiles inheriting v5_default get them unchanged.
backtest:
  slippage_pct: 0.02                # 2% haircut on entry premium
  holding_strategy: fixed_window    # close after N walltime days OR DTE floor
  holding_window_days: 5            # Track B's 3-5 day "ignite or die" window
  exit_on_dte_lte: 2                # hard safety floor; expiry-day chaos avoided
  dte_based_close_threshold: 7      # used only by holding_strategy=dte_based
  walk_forward_windows: 8           # 3-month slices over a 2-year backtest
  walk_forward_min_consistency_pct: 0.75  # 6-of-8 at default N; N-independent

# --- Phase 3.3.2 data source adapter settings ---
# Non-credential tunables only. Real API keys live in .env (see
# .env.example for the variable names). Profiles that don't need
# a particular source can omit the override and inherit defaults
# from ThetaDataSettings.
data_sources:
  thetadata:
    rate_limit_requests_per_second: 10.0   # Pro plan tier
    historical_concurrency: 4              # Pro plan supports 4
    live_reconnect_max_attempts: 5
    live_reconnect_initial_backoff_s: 1.0
    live_reconnect_max_backoff_s: 60.0
  unusual_whales:
    rate_limit_requests_per_second: 2.0    # ~120/min API-Plus tier
    historical_concurrency: 2              # aggregated endpoints, slower
    live_reconnect_max_attempts: 5
    live_reconnect_initial_backoff_s: 1.0
    live_reconnect_max_backoff_s: 60.0
    cache_ttl:
      catalyst_calendar_seconds: 3600      # events change rarely intraday
      dealer_gamma_seconds: 300            # gamma updates through the day
      iv_history_seconds: 600              # minute-level IV snapshots
      sector_map_seconds: 86400            # ticker→sector glacial
      dark_pool_seconds: 60                # DP prints stream constantly
      open_interest_seconds: 600           # EOD authoritative + intraday est

live:
  # Phase 4 reserve. Phase 3.3.5's live observer does NOT consume
  # this value; the field exists so operator-curated YAML doesn't
  # need to be re-edited when Phase 4 wires the dashboard.
  dashboard_refresh_seconds: 2.0
