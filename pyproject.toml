[project]
name = "uoa-detector"
version = "0.1.0"
description = "UOA + Convexity Detector v5 — options-flow signal detection system."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "pandas>=2.2",
    "typer>=0.12",
    "ruamel.yaml>=0.18",
    "pyarrow>=16.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "httpx>=0.27",
    "websockets>=13.0",
]

[project.scripts]
uoa-detector = "uoa_detector.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "freezegun>=1.5",
    "ruff>=0.5",
    "mypy>=1.10",
    "pandas-stubs>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uoa_detector"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "N",             # pep8-naming
    "SIM",           # simplify
    "RUF",           # ruff-specific
]
ignore = [
    "E501",  # line length handled by formatter
    "RUF002",  # ambiguous Unicode in docstrings — intentional (matches spec typography)
    "RUF003",  # ambiguous Unicode in comments — intentional (matches spec typography)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "N802"]
# Typer documents Option/Argument as defaults; B008 is wrong here.
"src/uoa_detector/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_decorators = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "freezegun.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "ruamel.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
markers = [
    "integration: tests that hit real external services (ThetaData, Unusual Whales). Skipped by default; require credentials in env to run.",
]
